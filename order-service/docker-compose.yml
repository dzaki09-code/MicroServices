
services:
  order-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: order-db
      DB_PORT: 3306
      DB_DATABASE: order_service
      DB_USERNAME: order_user
      DB_PASSWORD: order_password
    depends_on:
      order-db:
        condition: service_healthy

  order-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_service
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=root_password"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  product-db-data:
  order-db-data: